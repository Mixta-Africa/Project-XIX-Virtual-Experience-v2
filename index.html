<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project XIX — The Clubhouse | Mixta Africa</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif}
#canvas-container{width:100vw;height:100vh}

/* ── LOADING ──────────────────────────────────── */
#loading{
  position:fixed;inset:0;background:#080a06;
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;
}
#loading .logo{color:#c9a84c;font-size:2.5rem;font-weight:200;letter-spacing:.35em;margin-bottom:.4rem}
#loading .sub{color:rgba(255,255,255,.35);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:2.5rem}
#loading-bar-wrap{width:220px;height:1px;background:rgba(255,255,255,.1)}
#loading-bar{height:1px;background:#c9a84c;width:0;transition:width .3s}
#start-btn{
  margin-top:2rem;padding:12px 36px;background:transparent;
  border:1px solid rgba(201,168,76,.45);color:#c9a84c;font-size:.72rem;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer;border-radius:2px;
  transition:all .2s;display:none;
}
#start-btn:hover{background:rgba(201,168,76,.08);border-color:#c9a84c}

/* ── HUD ──────────────────────────────────────── */
#ui{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud-top{
  position:absolute;top:0;left:0;right:0;
  padding:1rem 1.4rem;
  background:linear-gradient(to bottom,rgba(0,0,0,.65),transparent);
  display:flex;justify-content:space-between;align-items:flex-start;
}
#room-label{color:#fff;font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
#room-sub{color:rgba(255,255,255,.45);font-size:.68rem;margin-top:.2rem;letter-spacing:.05em}
#brand{color:rgba(255,255,255,.4);font-size:.65rem;text-align:right;letter-spacing:.08em;text-transform:uppercase;line-height:1.7}

/* ── WEATHER / TIME BADGE ─────────────────────── */
#weather-badge{
  position:absolute;top:3.8rem;right:1.4rem;pointer-events:all;
  display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;
}
.wx-btn{
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.7);font-size:.62rem;padding:.3rem .65rem;
  border-radius:3px;cursor:pointer;letter-spacing:.05em;transition:all .15s;
}
.wx-btn:hover,.wx-btn.active{background:rgba(201,168,76,.2);border-color:rgba(201,168,76,.6);color:#c9a84c}

/* ── ROOM NAV ─────────────────────────────────── */
#controls-panel{
  pointer-events:all;
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,rgba(0,0,0,.5) 60%,transparent 100%);
  padding:1.1rem 1.4rem 1.3rem;
}
#rooms-label{color:rgba(255,255,255,.3);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.6rem}
#room-buttons{display:flex;gap:.4rem;flex-wrap:wrap}
.room-btn{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  color:rgba(255,255,255,.75);font-size:.68rem;padding:.45rem .9rem;
  border-radius:3px;cursor:pointer;transition:all .15s;letter-spacing:.03em;
}
.room-btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35)}
.room-btn.active{background:rgba(201,168,76,.18);border-color:rgba(201,168,76,.6);color:#c9a84c}
.room-btn .floor-tag{font-size:.58rem;opacity:.55;margin-left:.3rem}

/* ── CROSSHAIR ────────────────────────────────── */
#crosshair{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:14px;height:14px;
}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.65)}
#crosshair::before{width:1.5px;height:14px;left:6.25px;top:0}
#crosshair::after{height:1.5px;width:14px;top:6.25px;left:0}

/* ── MOVE HINT ────────────────────────────────── */
#move-hint{
  position:absolute;bottom:6.5rem;right:1.4rem;
  color:rgba(255,255,255,.28);font-size:.62rem;text-align:right;line-height:1.9;letter-spacing:.05em;
}
</style>
</head>
<body>

<div id="loading">
  <div class="logo">XIX</div>
  <div class="sub">The Clubhouse · Lakowe · Lagos State</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <button id="start-btn" onclick="startExperience()">Enter Clubhouse</button>
</div>

<div id="canvas-container"></div>

<div id="ui">
  <div id="crosshair"></div>
  <div id="hud-top">
    <div>
      <div id="room-label">Ground Floor — Arrival Court</div>
      <div id="room-sub">Lakowe Crossings Polo Clubhouse · Project XIX</div>
    </div>
    <div id="brand">Mixta Africa<br>Project XIX</div>
  </div>

  <div id="weather-badge">
    <button class="wx-btn active" onclick="setTime('morning')">🌅 Morning</button>
    <button class="wx-btn" onclick="setTime('afternoon')">☀️ Afternoon</button>
    <button class="wx-btn" onclick="setTime('sunset')">🌇 Sunset</button>
    <button class="wx-btn" onclick="setTime('night')">🌙 Night</button>
    <button class="wx-btn" onclick="setWeather('clear')">Clear</button>
    <button class="wx-btn" onclick="setWeather('cloudy')">Cloudy</button>
    <button class="wx-btn" onclick="setWeather('rain')">Rain</button>
  </div>

  <div id="move-hint">WASD / Arrow keys · Click to look<br>ESC to release mouse · Shift to sprint</div>

  <div id="controls-panel">
    <div id="rooms-label">Navigate to room</div>
    <div id="room-buttons"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  PROJECT XIX — CLUBHOUSE VR  (built on clubhouse_vr.html base)
//  New: realistic procedural palms, weather/time system, PBR mats
// ═══════════════════════════════════════════════════════════════════

// ── ARCHITECTURAL GRID (1 unit = 1 metre) ──────────────────────────
// 9 column bays × ~9m = 80m total width
// Rows A–F: A=rear/north, F=field/south
const GRID = {
  X: [-40,-31.4,-22.9,-14.3,-5.7,0,5.7,14.3,22.9,31.4,40],
  Z: { A:0, B:4, C:11, D:16, E:20, F:28 }
};
const FL = {
  gnd:-3.0, gnd_mid:-1.5, f0:0, f1:4.5, f2:9.0,
  roof:13.5, roofbox:16.0
};
const ROOMS = [
  {id:'arrival',   label:'Arrival Court',       sub:'Ground · South Entry', pos:[0,FL.f0+1.7,GRID.Z.F+2],   rotY:Math.PI},
  {id:'lobby',     label:'Reception & Lobby',   sub:'Ground · Central',    pos:[0,FL.f0+1.7,GRID.Z.D+2],   rotY:0},
  {id:'grandstand',label:'Grandstand',           sub:'Ground · Field',      pos:[0,FL.gnd+1.7,GRID.Z.F+8],  rotY:0},
  {id:'lounge',    label:'Members Lounge',       sub:'1st Floor · Terrace', pos:[0,FL.f1+1.7,GRID.Z.D+2],   rotY:0},
  {id:'bar',       label:'Bar & Restaurant',     sub:'1st Floor · Central', pos:[0,FL.f1+1.7,GRID.Z.B+5],   rotY:Math.PI*.15},
  {id:'suite_w',   label:'VIP Suite — West',     sub:'2nd Floor · West',    pos:[-29,FL.f2+1.7,GRID.Z.C],   rotY:0.3},
  {id:'suite_e',   label:'VIP Suite — East',     sub:'2nd Floor · East',    pos:[29,FL.f2+1.7,GRID.Z.C],    rotY:Math.PI-0.3},
  {id:'boardroom', label:'Boardroom',            sub:'2nd Floor · Central', pos:[0,FL.f2+1.7,GRID.Z.C],     rotY:0},
  {id:'roof',      label:'Roof Overview',        sub:'Roof Level',          pos:[0,FL.roofbox+0.5,GRID.Z.C], rotY:0},
];

let scene,camera,renderer,clock;
let moveF=false,moveB=false,moveL=false,moveR=false,sprint=false;
let pitch=0,yaw=0,locked=false,curRoom=0;

// ── WEATHER / TIME STATE ──────────────────────────────────────────
let sun,fillLight,hemi,ambientLight;
let rainParticles=null,rainActive=false;
let palmLeafMeshes=[];   // for wind animation
let emissiveLights=[];   // night window glow meshes
let elapsedTime=0;
let currentWeather='clear';
let leafWindOffset=0;

const TIME_PRESETS = {
  morning:  {skyTop:'#1a3a5c',skyHor:'#e87a30',skyGnd:'#3a6a28',sunCol:0xffa040,sunInt:2.8,sunPos:[80,60,-80],  ambInt:0.4,hemiSky:0xd4e8ff,hemiGnd:0x4a6a30,hemiInt:0.7,fogCol:'#c4a870',fogDens:0.009,expsr:1.1},
  afternoon:{skyTop:'#1a3a5c',skyHor:'#7ab4d4',skyGnd:'#4a7a38',sunCol:0xffe4a0,sunInt:3.5,sunPos:[60,120,30],  ambInt:0.55,hemiSky:0xd4e8ff,hemiGnd:0x4a6a30,hemiInt:1.0,fogCol:'#9ac5d4',fogDens:0.006,expsr:1.18},
  sunset:   {skyTop:'#0a1830',skyHor:'#e85020',skyGnd:'#5a3a20',sunCol:0xff6020,sunInt:2.2,sunPos:[-100,30,60], ambInt:0.3,hemiSky:0xff8040,hemiGnd:0x3a2a18,hemiInt:0.6,fogCol:'#e07040',fogDens:0.012,expsr:1.3},
  night:    {skyTop:'#000810',skyHor:'#050d1a',skyGnd:'#050a08',sunCol:0x6080c0,sunInt:0.2,sunPos:[0,50,-80],   ambInt:0.08,hemiSky:0x102040,hemiGnd:0x050a08,hemiInt:0.15,fogCol:'#050d18',fogDens:0.018,expsr:0.6},
};

function initScene(){
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x9ac5d4,0.006);
  camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,800);
  teleportTo(0);
  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.18;
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  clock=new THREE.Clock();
  buildSky();
  buildWorld();
  buildLighting();
  buildRain();
  buildUI();
  setTime('morning');
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  addEventListener('keydown',e=>{
    if(['KeyW','ArrowUp'].includes(e.code))moveF=true;
    if(['KeyS','ArrowDown'].includes(e.code))moveB=true;
    if(['KeyA','ArrowLeft'].includes(e.code))moveL=true;
    if(['KeyD','ArrowRight'].includes(e.code))moveR=true;
    if(e.code==='ShiftLeft'||e.code==='ShiftRight')sprint=true;
    if(e.key==='Escape'&&locked)document.exitPointerLock();
    if(['KeyW','KeyS','KeyA','KeyD','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  });
  addEventListener('keyup',e=>{
    if(['KeyW','ArrowUp'].includes(e.code))moveF=false;
    if(['KeyS','ArrowDown'].includes(e.code))moveB=false;
    if(['KeyA','ArrowLeft'].includes(e.code))moveL=false;
    if(['KeyD','ArrowRight'].includes(e.code))moveR=false;
    if(e.code==='ShiftLeft'||e.code==='ShiftRight')sprint=false;
  });
  addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement});
  renderer.domElement.addEventListener('click',()=>renderer.domElement.requestPointerLock());
  addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0022;pitch=Math.max(-1.4,Math.min(1.4,pitch-e.movementY*.0022));});
  animate();
}

// ─── SKY DOME (procedural gradient, rebuilt on time change) ──────────

let skyMesh;
function buildSky(){
  const sg=new THREE.SphereGeometry(500,32,16);
  const skyC=document.createElement('canvas');skyC.width=4;skyC.height=256;
  const sx=skyC.getContext('2d');
  const g=sx.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#1a3a5c');g.addColorStop(.55,'#7ab4d4');g.addColorStop(1,'#e0ece8');
  sx.fillStyle=g;sx.fillRect(0,0,4,256);
  const st=new THREE.CanvasTexture(skyC);
  skyMesh=new THREE.Mesh(sg,new THREE.MeshBasicMaterial({map:st,side:THREE.BackSide}));
  scene.add(skyMesh);
}
function updateSkyGradient(top,hor,gnd){
  const sc=document.createElement('canvas');sc.width=4;sc.height=256;
  const sx=sc.getContext('2d');
  const g=sx.createLinearGradient(0,0,0,256);
  g.addColorStop(0,top);g.addColorStop(.5,hor);g.addColorStop(1,gnd);
  sx.fillStyle=g;sx.fillRect(0,0,4,256);
  skyMesh.material.map=new THREE.CanvasTexture(sc);
  skyMesh.material.needsUpdate=true;
}

// ─── TIME OF DAY ─────────────────────────────────────────────────

window.setTime=function(name){
  const p=TIME_PRESETS[name];
  if(!p)return;
  document.querySelectorAll('.wx-btn').forEach(b=>{
    if(['morning','afternoon','sunset','night'].some(t=>b.textContent.toLowerCase().includes(t)))
      b.classList.toggle('active',b.textContent.toLowerCase().includes(name));
  });
  updateSkyGradient(p.skyTop,p.skyHor,p.skyGnd);
  scene.fog.color.set(p.fogCol);scene.fog.density=p.fogDens;
  if(sun){sun.color.setHex(p.sunCol);sun.intensity=p.sunInt;sun.position.set(...p.sunPos);}
  if(fillLight)fillLight.intensity=name==='night'?0:.6;
  if(hemi){hemi.color.setHex(p.hemiSky);hemi.groundColor.setHex(p.hemiGnd);hemi.intensity=p.hemiInt;}
  if(ambientLight)ambientLight.intensity=p.ambInt;
  renderer.toneMappingExposure=p.expsr;
  // Night: show villa emissive window glow
  emissiveLights.forEach(m=>m.visible=(name==='night'));
};

// ─── WEATHER ──────────────────────────────────────────────────────

window.setWeather=function(w){
  currentWeather=w;
  document.querySelectorAll('.wx-btn').forEach(b=>{
    if(['clear','cloudy','rain'].some(t=>b.textContent.toLowerCase().includes(t)))
      b.classList.toggle('active',b.textContent.toLowerCase().includes(w));
  });
  rainActive=(w==='rain');
  if(rainParticles)rainParticles.visible=rainActive;
  scene.fog.density = w==='rain' ? 0.025 : (w==='cloudy'?0.012:TIME_PRESETS['afternoon'].fogDens);
};

function buildRain(){
  const geo=new THREE.BufferGeometry();
  const count=6000;
  const positions=new Float32Array(count*3);
  const speeds=new Float32Array(count);
  for(let i=0;i<count;i++){
    positions[i*3+0]=(Math.random()-.5)*200;
    positions[i*3+1]=Math.random()*50;
    positions[i*3+2]=(Math.random()-.5)*200+GRID.Z.F;
    speeds[i]=1.5+Math.random()*2;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  const mat=new THREE.PointsMaterial({color:0x88aacc,size:.12,transparent:true,opacity:.55});
  rainParticles=new THREE.Points(geo,mat);
  rainParticles.visible=false;
  scene.add(rainParticles);
}
function tickRain(dt){
  if(!rainActive||!rainParticles)return;
  const pos=rainParticles.geometry.attributes.position.array;
  for(let i=0;i<pos.length;i+=3){
    pos[i+1]-=18*dt;
    if(pos[i+1]<-2){pos[i+1]=48;pos[i]=(Math.random()-.5)*200;pos[i+2]=(Math.random()-.5)*200+GRID.Z.F;}
  }
  rainParticles.geometry.attributes.position.needsUpdate=true;
}

// ─── MATERIAL FACTORY ────────────────────────────────────────────

function mat(col,rough=.75,metal=0,op=1){
  return new THREE.MeshStandardMaterial({color:col,roughness:rough,metalness:metal,transparent:op<1,opacity:op});
}
function glassMat(col=0x1a2a35,op=.5){
  return new THREE.MeshStandardMaterial({color:col,roughness:.04,metalness:.3,transparent:true,opacity:op,side:THREE.DoubleSide});
}

// ─── GEOMETRY HELPERS ────────────────────────────────────────────

function box(w,h,d,m,x=0,y=0,z=0,ry=0){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  mesh.position.set(x,y+h/2,z);mesh.rotation.y=ry;
  mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh;
}
function plane(w,d,m,x=0,y=0,z=0){
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,d),m);
  mesh.rotation.x=-Math.PI/2;mesh.position.set(x,y,z);
  mesh.receiveShadow=true;scene.add(mesh);return mesh;
}
function cyl(rt,rb,h,seg,m,x=0,y=0,z=0){
  const mesh=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),m);
  mesh.position.set(x,y+h/2,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh;
}

// ─── WORLD ───────────────────────────────────────────────────────

function buildWorld(){
  buildTerrain();
  buildPoloField();
  buildGrandstand();
  buildGroundFloor();
  buildFirstFloor();
  buildSecondFloor();
  buildRoof();
  buildFacadeColumns();
  buildWindows();
  buildBalconyRails();
  buildRoofboxes();
  buildRealPalms();
  buildFloweringTrees();
  buildDistantTreeline();
  buildInteriorFurnishings();
  buildWindowEmissives();
}

// ─── TERRAIN ────────────────────────────────────────────────────

function buildTerrain(){
  plane(300,120,mat(0x8a8070,.95),0,-.01,GRID.Z.A-50);
  plane(400,250,mat(0x3a8820,.95),0,-.01,GRID.Z.F+90);
  // Stone paving around building
  plane(120,40,mat(0x9a9080,.88),0,-.01,GRID.Z.A-22);
}

// ─── POLO FIELD MARKINGS ────────────────────────────────────────

function buildPoloField(){
  const fz=GRID.Z.F+10;
  for(let i=0;i<16;i++){
    plane(250,12,i%2===0?mat(0x3a8820,.94):mat(0x2e7018,.96),0,0,fz+i*12);
  }
  const wl=mat(0xffffff,.8);
  [[-52,0,fz+90],[52,0,fz+90]].forEach(([x,y,z])=>plane(.35,180,wl,x,y,z));
  plane(104,.35,wl,0,0,fz);plane(104,.35,wl,0,0,fz+180);
  // 30/40/60 yard lines
  [27.4,36.6,54.9].forEach(d=>{
    plane(104,.25,mat(0xffffff,.6),0,.01,fz+d);
    plane(104,.25,mat(0xffffff,.6),0,.01,fz+180-d);
  });
  // Goal posts
  [[0,fz],[0,fz+180]].forEach(([px,pz])=>{
    [0,-13,13].forEach(ox=>{cyl(.1,.1,5,8,mat(0xfafafa,.5,.3),px+ox,.01,pz);});
  });
}

// ─── GRANDSTAND ─────────────────────────────────────────────────

function buildGrandstand(){
  const gsMat=mat(0xc8bea8,.88);
  const seatMat=mat(0xb8a880,.9);
  const stepRise=.55,stepTread=1.1;
  const gsW=80,gsStartZ=GRID.Z.E+1,gsBase=FL.gnd;

  // 5 tiers
  for(let s=0;s<5;s++){
    const y=gsBase+s*stepRise,z=gsStartZ+s*stepTread;
    box(gsW,stepRise,.2,gsMat,0,y,z);
    plane(gsW,stepTread,gsMat,0,y+stepRise,z+stepTread/2);
    // Seat rows
    for(let x=-36;x<=36;x+=.6){
      box(.44,.44,.07,seatMat,x,y+stepRise,z+.35);
      box(.44,.07,.42,seatMat,x,y+stepRise-.15,z+.6);
    }
  }
  box(gsW,3.5,.4,mat(0xe8e0d0,.85),0,gsBase+5*stepRise,gsStartZ-.2);
  // Hedge trim
  box(2,1.2,8,mat(0x1e5e18,.95),-41,gsBase+5*stepRise,gsStartZ+2);
  box(2,1.2,8,mat(0x1e5e18,.95), 41,gsBase+5*stepRise,gsStartZ+2);
  plane(gsW,6,mat(0xd8cdb8,.45,.05),0,FL.f0,GRID.Z.E-3);
}

// ─── GROUND FLOOR ───────────────────────────────────────────────

function buildGroundFloor(){
  const y0=FL.f0,bW=80,bD=16;
  const wallM=mat(0xe8e0d0,.85);
  const plasterM=mat(0xece5d5,.82);
  const stoneM=mat(0xb8a888,.9);
  const floorM=mat(0xd8cdb8,.45,.05);

  plane(bW,bD,floorM,0,y0,(GRID.Z.B+GRID.Z.D)/2);
  // Perimeter walls
  box(bW,4.3,.35,wallM,0,y0,GRID.Z.B-.17);
  box(bW,4.3,.35,wallM,0,y0,GRID.Z.D+.17);
  box(.35,4.3,bD,wallM,-bW/2+.17,y0,(GRID.Z.B+GRID.Z.D)/2);
  box(.35,4.3,bD,wallM, bW/2-.17,y0,(GRID.Z.B+GRID.Z.D)/2);

  // Wood-slat ceiling (as in render — warm linear battens)
  const slatM=mat(0x6a4a28,.8,.05);
  for(let sl=0;sl<38;sl++) box(bW,.06,.1,slatM,0,y0+4.22,(GRID.Z.B+GRID.Z.D)/2-9+sl*.48);

  // Stone reception back wall
  box(14,2.8,.15,stoneM,0,y0,GRID.Z.E-.1);
  // Reception desk
  box(8,1.1,1.2,mat(0x5a3c1c,.75,.05),0,y0,GRID.Z.E+1.5);
  box(8,.06,1.3,mat(0xd8cdb8,.2,.1),0,y0+1.1,GRID.Z.E+1.5);

  // Green ceramic vases
  addVase(-3,y0,GRID.Z.E-1); addVase(3,y0,GRID.Z.E-1);

  // Stair cores
  buildStaircore(-18,y0,GRID.Z.E+4);

// Fully procedural: trunk rings, bark geometry, animated fronds

function buildRealPalms(){
  const positions=[
    [-45,0,GRID.Z.C],[-45,0,GRID.Z.D],

    [-8, 0,GRID.Z.F+14],[8,0,GRID.Z.F+14],
  ];
  positions.forEach(([x,y,z])=>addRealisticPalm(x,y,z,1.0+Math.random()*.4));

function addRealisticPalm(x,y,z,scale=1){
  const g=new THREE.Group();
  const trunkH=(9+Math.random()*4)*scale;
  const lean=(Math.random()-.5)*.08;
  const leanDir=Math.random()*Math.PI*2;

  // ── TRUNK: stacked tapered segments with ring texture ──────────
  const trunkSegs=12;
  const segH=trunkH/trunkSegs;
  for(let i=0;i<trunkSegs;i++){
    const t=i/trunkSegs;
    const r=(.22-.1*t)*scale; // tapers from .22 to .12
    // Slight ring bulge alternating
    const bumpR=r*(1+.05*Math.sin(i*3.14));
    const segGeo=new THREE.CylinderGeometry(bumpR*.9,bumpR,segH,10,1);
    // Random ring color variation
    const c=0x7a5c30+Math.floor(Math.random()*0x101010);
    const m=new THREE.MeshStandardMaterial({color:c,roughness:.9,metalness:0});
    const seg=new THREE.Mesh(segGeo,m);
    const ly=y+segH/2+i*segH;
    const lx=Math.cos(leanDir)*lean*i*segH*.3;
    const lz=Math.sin(leanDir)*lean*i*segH*.3;
    seg.position.set(lx,ly,lz);
    seg.castShadow=true;seg.receiveShadow=true;
    g.add(seg);
  }

  // Coconut cluster at crown
  const crownX=Math.cos(leanDir)*lean*trunkH*.3;
  const crownY=y+trunkH;
  const crownZ=Math.sin(leanDir)*lean*trunkH*.3;
  const cnutM=new THREE.MeshStandardMaterial({color:0x8c7a30,roughness:.7});
  for(let ci=0;ci<4;ci++){
    const ca=(ci/4)*Math.PI*2+.3;
    const cn=new THREE.Mesh(new THREE.SphereGeometry(.2*scale,8,6),cnutM);
    cn.position.set(crownX+Math.cos(ca)*.35*scale,crownY-.15,crownZ+Math.sin(ca)*.35*scale);
    cn.castShadow=true;g.add(cn);
  }

  // ── FRONDS: curved PlaneGeometry with vertex displacement ──────
  const frondCount=10+Math.floor(Math.random()*3);
  const frondMat=new THREE.MeshStandardMaterial({
    color:0x2a7228,roughness:.85,metalness:0,
    side:THREE.DoubleSide,
    // Vertex normal map for leaf texture feel
  });

  for(let fi=0;fi<frondCount;fi++){
    const angle=(fi/frondCount)*Math.PI*2+Math.random()*.15;
    const frondLen=(6+Math.random()*2)*scale;
    const droop=.5+Math.random()*.3;
    const frondW=.7*scale;

    // Build frond as PlaneGeometry with curved vertices
    const segs=8;
    const fGeo=new THREE.PlaneGeometry(frondW,frondLen,1,segs);
    const pos=fGeo.attributes.position;
    for(let vi=0;vi<pos.count;vi++){
      const t=(.5+pos.getY(vi)/frondLen);  // 0=tip,1=base
      // Apply droop curve along frond length
      const droopY=-droop*t*t*frondLen*.6;
      const droopZ= droop*t*t*frondLen*.3;
      pos.setY(vi,pos.getY(vi)+droopY);
      pos.setZ(vi,droopZ);
    }
    pos.needsUpdate=true;fGeo.computeVertexNormals();

    // Alternate colour slightly for leaflet variety
    const leafCol=new THREE.MeshStandardMaterial({
      color:fi%2===0?0x2a7228:0x336630,roughness:.88,side:THREE.DoubleSide
    });
    const frond=new THREE.Mesh(fGeo,leafCol);
    // Position at crown
    frond.position.set(crownX,crownY+.2,crownZ);
    // Rotate to spread radially and droop outward
    frond.rotation.order='YXZ';
    frond.rotation.y=angle;
    frond.rotation.x=-Math.PI/2+.3; // tilt downward from vertical
    frond.castShadow=false;

    g.add(frond);
    palmLeafMeshes.push({mesh:frond,baseAngleX:frond.rotation.x,phase:fi*.7+Math.random()*6.28,speed:.8+Math.random()*.4});
  }

  g.position.set(x,0,z);
  scene.add(g);
}

  const cont=document.getElementById('room-buttons');
  ROOMS.forEach((r,i)=>{
    const btn=document.createElement('button');
    btn.className='room-btn'+(i===0?' active':'');
    btn.id='btn-'+r.id;
    const fl=r.sub.split('·')[0].trim();
    btn.innerHTML=r.label+'<span class="floor-tag">'+fl+'</span>';
    btn.onclick=()=>teleportTo(i);
    cont.appendChild(btn);
  });
}
function teleportTo(idx){
  curRoom=idx;const r=ROOMS[idx];
  camera.position.set(r.pos[0],r.pos[1],r.pos[2]);
  yaw=r.rotY;pitch=0;
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=0;
  document.getElementById('room-label').textContent=r.label;
  document.getElementById('room-sub').textContent=r.sub+' · Project XIX Clubhouse';
  document.querySelectorAll('.room-btn').forEach((b,i)=>b.classList.toggle('active',i===idx));
}

// ─── ANIMATION ──────────────────────────────────────────────────

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  elapsedTime+=dt;

  // Movement
  if(moveF||moveB||moveL||moveR){
    const spd=sprint?14:5;
    const dir=new THREE.Vector3();
    if(moveF)dir.z-=1;if(moveB)dir.z+=1;
    if(moveL)dir.x-=1;if(moveR)dir.x+=1;
    dir.normalize().applyQuaternion(camera.quaternion);dir.y=0;
    camera.position.addScaledVector(dir,spd*dt);
  }
  // Mouse look
  camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;

  // Animated palm fronds (wind)
  palmLeafMeshes.forEach(({mesh,baseAngleX,phase,speed})=>{
    mesh.rotation.x=baseAngleX+Math.sin(elapsedTime*speed+phase)*.04;
    mesh.rotation.z=Math.sin(elapsedTime*speed*.7+phase)*.025;
  });

  tickRain(dt);
  renderer.render(scene,camera);
}

// ─── LOADING ─────────────────────────────────────────────────────

function fakeLoad(){
  const bar=document.getElementById('loading-bar');
  let p=0;
  const iv=setInterval(()=>{
    p+=Math.random()*14;
    if(p>=100){p=100;clearInterval(iv);document.getElementById('start-btn').style.display='block';}
    bar.style.width=p+'%';
  },100);
}
function startExperience(){
  document.getElementById('loading').style.display='none';
  initScene();
}
fakeLoad();
</script>
